suite = "s4_safety_revoke"
description = "Suite 4: Safety Under Contention & Option-A Unilateral Revocation (toolagent_trace.jsonl hotspot, 15% capacity, checksummed frames)"

[defaults]
num_blocks = 1
concurrency = 1
rdma_dev = "mlx5_3"
gid_index = 3
donor_gpu = 0
initiator_gpu = 1
trace_path = "/workspace/target/bench-traces/toolagent_trace.jsonl"
max_requests = 128
capacity_ratio = 0.15

[[jobs]]
case = "4_revoke_0p1pct"
mode = "unilateral_revoke"
systems = ["vericache", "mooncake"]
revoke_rate = 0.001
iters = 1000
chunk_bytes_list = [262144]

[[jobs]]
case = "4_revoke_1pct"
mode = "unilateral_revoke"
systems = ["vericache", "mooncake"]
revoke_rate = 0.01
iters = 400
chunk_bytes_list = [262144, 4194304]

[[jobs]]
case = "4_revoke_5pct"
mode = "unilateral_revoke"
systems = ["vericache", "mooncake"]
revoke_rate = 0.05
iters = 300
chunk_bytes_list = [262144, 4194304]
