[workspace]

[package]
name = "vericache-python"
version = "0.1.0"
edition = "2024"
description = "Zero-external-dependency C ABI / Python binding and vLLM v1 KVConnector for VeriCache."

[lib]
name = "vericache_python"
crate-type = ["cdylib", "rlib"]

[features]
default = ["cuda"]
cuda = ["vericache/cuda", "vericache-core/cuda"]

[dependencies]
vericache = { path = "../vericache", default-features = false, features = ["nvme", "rdma"] }
vericache-core = { path = "../vericache-core", default-features = false, features = ["nvme", "rdma"] }
