[workspace]

[package]
name = "vericache"
version = "0.1.0"
edition = "2024"
description = "Ergonomic, location-transparent distributed KV cache facade over the formally verified VeriCache core (Unverified Policy + Verified Enforcement)."

[package.metadata.verus]
verify = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)', 'cfg(verus_keep_ghost_body)'] }

[dependencies]
foundation = { package = "vericache-foundation", path = "../vericache-foundation" }
transfer = { package = "vericache-transfer", path = "../vericache-transfer" }
vericache-core = { path = "../vericache-core" }
vstd = { path = "/opt/vericache/verus/source/vstd" }
