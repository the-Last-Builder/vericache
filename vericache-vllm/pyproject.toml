[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vericache-vllm"
version = "0.1.0"
description = "VeriCache host staging bridge for vLLM V1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]

[project.optional-dependencies]
vllm = ["vllm==0.13.0"]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
