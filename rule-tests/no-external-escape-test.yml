id: no-external-escape
valid:
  - |
    // external_body external_fn_specification verifier::external
    verus! {
        fn clean() { let external = 1usize; }
        #[verifier::external_body]
        fn allowed_by_this_rule() {}
    }
invalid:
  - |
    verus! {
        #[verifier::external]
        fn bad() {}
    }
  - |
    #![verifier::external]
    verus! { fn bad() {} }
  - |
    verus! {
        #[cfg_attr(verus_only, verifier::external)]
        fn bad() {}
    }
  - |
    verus! {
        #[verifier::external_fn_specification]
        fn bad() {}
    }
  - |
    verus! {
        #[verifier::external_type_specification]
        struct Bad(u8);
    }
  - |
    verus! {
        #[verifier::external_trait_specification]
        trait Bad {}
    }
  - |
    verus! {
        #[verifier::external_trait_extension(E via P)]
        trait Bad {}
    }
  - |
    verus! {
        #[verifier::allow_in_spec]
        fn bad() {}
    }
