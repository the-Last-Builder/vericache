id: no-cuda-dep
language: verus
severity: error
message: "CUDA backend modules may not be referenced from Host or NVMe backend layers."
rule:
  any:
    - kind: use_declaration
      regex: '(?s)(transfer|backends|super)::.*\bcuda\b'
    - kind: scoped_identifier
      regex: '(^|::)(transfer|backends|super(?:::\s*super)*)::cuda\b'
    - kind: use_declaration
      regex: '(?s)(^|\s|::)transfer\s+as\b'
    - kind: use_declaration
      regex: '(?s)(^|\s|::)transfer\s*;'
    - kind: use_declaration
      regex: '(?s)(^|\s|::)transfer::\*'
    - kind: use_declaration
      regex: '(?s)(^|\s|::)transfer::\{[^{}]*\bself\b'
    - kind: extern_crate_declaration
      regex: '\btransfer\b'
